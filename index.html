<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RiftMastery" />
  <title>RiftMastery</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css?v=0.4.3" />
  <link rel="stylesheet" href="./lab.css?v=0.4.3" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">RIFTMASTERY</div>
        <h1 id="screenTitle">Home</h1>
      </div>
      <div id="saveStatus" class="save-status" aria-live="polite">Saved on this device</div>
    </header>

    <main id="main" class="main-content">
      <section id="screen-home" class="screen active" data-screen="home"></section>
      <section id="screen-play" class="screen" data-screen="play"></section>
      <section id="screen-decks" class="screen" data-screen="decks"></section>
      <section id="screen-history" class="screen" data-screen="history"></section>
      <section id="screen-stats" class="screen" data-screen="stats"></section>
      <section id="screen-more" class="screen" data-screen="more"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-nav="home" aria-label="Home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-nav="play" aria-label="Play"><span>▶</span><small>Play</small></button>
      <button class="nav-item" data-nav="decks" aria-label="Decks"><span>▤</span><small>Decks</small></button>
      <button class="nav-item" data-nav="history" aria-label="History"><span>◷</span><small>History</small></button>
      <button class="nav-item" data-nav="stats" aria-label="Stats"><span>▥</span><small>Stats</small></button>
      <button class="nav-item" data-nav="more" aria-label="More"><span>•••</span><small>More</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" value="cancel" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js?v=0.4.3"></script>
  <script type="module" src="./lab.js?v=0.4.3"></script>
  <script type="module" src="./sync.js?v=0.4.3"></script>
</body>
</html>

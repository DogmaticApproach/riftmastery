<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RiftMastery" />
  <title>RiftMastery</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg?v=0.6.1" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg?v=0.6.1" />
  <link rel="stylesheet" href="./styles.css?v=0.6.1" />
  <link rel="stylesheet" href="./lab.css?v=0.6.1" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">RIFTMASTERY</div>
        <h1 id="screenTitle">Home</h1>
      </div>
      <div id="saveStatus" class="save-status" aria-live="polite">Saved on this device</div>
    </header>

    <main id="main" class="main-content">
      <section id="screen-home" class="screen active" data-screen="home"></section>
      <section id="screen-play" class="screen" data-screen="play"></section>
      <section id="screen-decks" class="screen" data-screen="decks"></section>
      <section id="screen-history" class="screen" data-screen="history"></section>
      <section id="screen-stats" class="screen" data-screen="stats"></section>
      <section id="screen-more" class="screen" data-screen="more"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-nav="home" aria-label="Training Hall"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg></span><small>Home</small></button>
      <button class="nav-item" data-nav="play" aria-label="Train"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg></span><small>Train</small></button>
      <button class="nav-item" data-nav="decks" aria-label="Decks"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h13v16H7z"/><path d="M4 6v15h13M10 7h7M10 11h7M10 15h5"/></svg></span><small>Decks</small></button>
      <button class="nav-item" data-nav="history" aria-label="Review"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><small>Review</small></button>
      <button class="nav-item" data-nav="stats" aria-label="Progress"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9M10 20V5h4v15M16 20V8h4v12"/></svg></span><small>Progress</small></button>
      <button class="nav-item" data-nav="more" aria-label="Journal and Lab"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><small>Journal</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" value="cancel" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // Cloud-sync rollout: retire older RiftMastery service workers/caches without touching IndexedDB data.
    if (navigator.onLine && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(regs => Promise.all(regs.map(r => r.unregister())))
        .catch(() => {});
      if ('caches' in window) {
        caches.keys()
          .then(keys => Promise.all(keys.filter(k => k.startsWith('riftmastery-')).map(k => caches.delete(k))))
          .catch(() => {});
      }
    }
  </script>
  <script type="module" src="./app.js?v=0.6.1"></script>
  <script type="module" src="./lab.js?v=0.6.1"></script>
  <script type="module" src="./sync.js?v=0.6.1"></script>
</body>
</html>
